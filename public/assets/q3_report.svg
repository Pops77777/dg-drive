<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="doc-card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="#f1f5f9" />
  
  <!-- Clean White Document Sheet -->
  <rect x="75" y="25" width="450" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#doc-card-shadow)" />
  
  <!-- Teal Top Bar Accent -->
  <rect x="110" y="60" width="55" height="5" rx="2.5" fill="#0d9488" />
  
  <!-- Document Heading -->
  <text x="110" y="105" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#0f172a">Q3 Report Analyst</text>
  
  <!-- Thin divider -->
  <line x1="110" y1="125" x2="490" y2="125" stroke="#f1f5f9" stroke-width="2" />
  
  <!-- Paragraph line placeholders -->
  <rect x="110" y="150" width="380" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="110" y="170" width="360" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="110" y="190" width="375" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="110" y="210" width="290" height="7" rx="3.5" fill="#cbd5e1" />
  
  <rect x="110" y="245" width="380" height="7" rx="3.5" fill="#e2e8f0" />
  <rect x="110" y="265" width="340" height="7" rx="3.5" fill="#e2e8f0" />
  <rect x="110" y="285" width="310" height="7" rx="3.5" fill="#e2e8f0" />
  
  <!-- Signature Section -->
  <path d="M115,355 Q135,335 150,350 T180,340 T210,355" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="110" y1="365" x2="220" y2="365" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Page number / stamp -->
  <text x="460" y="365" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">2/10</text>
</svg>
