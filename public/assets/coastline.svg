<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ocean-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="water-surf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="cliff-rock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="50%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>
    <linearGradient id="grass-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>
    <filter id="foam-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Ocean -->
  <rect width="600" height="450" fill="url(#ocean-deep)" />
  <path d="M0,180 Q150,140 320,210 T600,160 L600,450 L0,450 Z" fill="#0891b2" opacity="0.6" />
  <path d="M0,260 Q180,220 380,290 T600,240 L600,450 L0,450 Z" fill="#0e7490" opacity="0.5" />
  <!-- Wave Surf lines -->
  <path d="M120,0 Q240,120 340,160 Q440,200 480,260 Q520,330 600,360" fill="none" stroke="#e0f2fe" stroke-width="12" opacity="0.75" filter="url(#foam-glow)" />
  <path d="M140,0 Q255,130 355,170 Q455,210 495,270 Q535,340 600,370" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
  <path d="M180,0 Q280,110 370,140 Q470,180 520,240 Q560,300 600,320" fill="none" stroke="#bae6fd" stroke-width="8" opacity="0.6" />
  <!-- Rugged Coastal Cliffs -->
  <path d="M180,0 L260,80 L320,130 L390,150 L450,210 L480,250 L520,310 L560,350 L600,380 L600,0 Z" fill="url(#cliff-rock)" />
  <!-- Green cliff vegetation -->
  <path d="M220,0 L270,50 L340,90 L400,110 L450,160 L490,200 L530,240 L570,270 L600,280 L600,0 Z" fill="url(#grass-green)" />
  <path d="M260,0 L310,30 L380,70 L430,90 L480,120 L530,150 L580,180 L600,190 L600,0 Z" fill="#84cc16" opacity="0.8" />
  <!-- Distant horizon atmosphere -->
  <rect width="600" height="90" fill="linear-gradient(to bottom, rgba(224, 242, 254, 0.45), transparent)" />
  <circle cx="280" cy="180" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="340" cy="220" r="2" fill="#ffffff" opacity="0.8" />
</svg>
