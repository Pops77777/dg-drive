<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sunset-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="40%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sunset-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="600" height="230" fill="url(#sunset-sky)" />
  <!-- Water -->
  <rect y="230" width="600" height="220" fill="url(#sunset-water)" />
  <!-- Sun glow reflection -->
  <ellipse cx="300" cy="230" rx="90" ry="8" fill="#fde047" opacity="0.6" />
  <ellipse cx="300" cy="260" rx="140" ry="12" fill="#fb923c" opacity="0.35" />
  
  <!-- Wooden Pier Leading Forward -->
  <polygon points="270,230 330,230 420,450 180,450" fill="#78716c" />
  <polygon points="275,230 325,230 410,450 190,450" fill="#a8a29e" opacity="0.8" />
  
  <!-- Pier Planks horizontal lines -->
  <line x1="268" y1="240" x2="332" y2="240" stroke="#57534e" stroke-width="2" />
  <line x1="260" y1="260" x2="340" y2="260" stroke="#57534e" stroke-width="2.5" />
  <line x1="250" y1="290" x2="350" y2="290" stroke="#57534e" stroke-width="3" />
  <line x1="230" y1="330" x2="370" y2="330" stroke="#57534e" stroke-width="3.5" />
  <line x1="210" y1="380" x2="390" y2="380" stroke="#57534e" stroke-width="4" />
  <line x1="185" y1="440" x2="415" y2="440" stroke="#57534e" stroke-width="5" />
  
  <!-- Pier Railing / Posts -->
  <line x1="185" y1="450" x2="270" y2="230" stroke="#e7e5e4" stroke-width="3" />
  <line x1="415" y1="450" x2="330" y2="230" stroke="#e7e5e4" stroke-width="3" />
</svg>
