services:
  - type: web
    name: dgx-cloud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: LISTEN_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HTTPS
        value: "true"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        value: 92d8fd59f9a068eee02cb6feafe6147add2b5c01ad13d719822feb2c13619224
      - key: ADMIN_TELEGRAM_USERNAME
        value: Kingsmaster27
